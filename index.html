/* ── Month auto-date ── */
const extractMonthDate=(title)=>{
  if(!title)return null;
  const words=title.toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(Boolean);
  for(let i=0;i<MONTH_FULL.length;i++){
    if(words.includes(MONTH_FULL[i])||words.includes(MONTH_SHORT[i])){
      const today=new Date(todayStr()+"T00:00:00");
      let year=today.getFullYear();
      let candidate=new Date(year,i,1);
      if(candidate<today){year++;candidate=new Date(year,i,1);}
      return`${year}-${String(i+1).padStart(2,"0")}-01`;
    }
  }
  return null;
};

/* ── Time helpers ── */
const etNow=()=>{const now=new Date();return new Date(now.toLocaleString("en-US",{timeZone:"America/New_York"}));};
const todayStr=()=>{const d=etNow();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const genId=()=>crypto.randomUUID();
const daysDiff=s=>{if(!s)return null;const a=new Date(todayStr()+"T00:00:00"),b=new Date(s+"T00:00:00");return Math.round((b-a)/86400000);};

const parseFreq=f=>{
  if(!f)return{type:null};const s=f.trim().toLowerCase();
  if(s==="daily")return{type:"days",n:1,label:"daily"};
  if(s==="weekly")return{type:"weeks",n:1,label:"weekly"};
  if(s==="monthly")return{type:"months",n:1,label:"monthly"};
  if(s==="yearly")return{type:"years",n:1,label:"yearly"};
  if(s==="weekday"||s==="weekdays")return{type:"weekdays",label:"weekdays"};
  if(s==="weekend"||s==="weekends")return{type:"weekend",label:"weekends"};
  const wd=WDN.indexOf(s);if(wd>=0)return{type:"weekday",day:wd,label:`every ${WDL[wd]}`};
  const n=parseInt(s);if(!isNaN(n)&&n>0)return{type:"days",n,label:`every ${n}d`};
  return{type:null};
};
const nextDue=f=>{
  const p=parseFreq(f);if(!p.type)return null;
  const d=new Date(todayStr()+"T00:00:00");
  if(p.type==="days"){d.setDate(d.getDate()+p.n);}
  else if(p.type==="weeks"){d.setDate(d.getDate()+p.n*7);}
  else if(p.type==="months"){d.setMonth(d.getMonth()+p.n);}
  else if(p.type==="years"){d.setFullYear(d.getFullYear()+p.n);}
  else if(p.type==="weekday"){d.setDate(d.getDate()+1);while(d.getDay()!==p.day)d.setDate(d.getDate()+1);}
  else if(p.type==="weekdays"){d.setDate(d.getDate()+1);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);}
  else if(p.type==="weekend"){d.setDate(d.getDate()+1);while(d.getDay()!==0&&d.getDay()!==6)d.setDate(d.getDate()+1);}
  return d.toISOString().split("T")[0];
};

function Modal({onClose,children,maxWidth=490,top=false}){
  const{cardBg,border}=useTheme();
  return(
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",backdropFilter:"blur(4px)",zIndex:1000,display:"flex",alignItems:top?"flex-start":"center",justifyContent:"center",padding:16,paddingTop:top?62:16}}>

        {children}
      </div>

  );
}

/* ── Auth ── */
function AuthScreen({onAuth}){
  const[mode,setMode]=useState("login"),[email,setEmail]=useState(""),[pw,setPw]=useState(""),[loading,setLoading]=useState(false),[err,setErr]=useState("");
  const submit=async()=>{
    if(!email||!pw)return setErr("Email and password required");
    setLoading(true);setErr("");
    try{
      const res=mode==="login"?await db.auth.signInWithPassword({email,password:pw}):await db.auth.signUp({email,password:pw});
      if(res.error)throw res.error;
      if(mode==="signup"&&!res.data.session){setLoading(false);setErr("Check your email to confirm your account.");return;}
      onAuth(res.data.user);
    }catch(e){setErr(e.message||"Something went wrong");}
    setLoading(false);
  };
  const inp={width:"100%",padding:"11px 14px",borderRadius:9,border:"1px solid #a8c4e0",fontSize:15,fontFamily:"inherit",color:"#0a0a1a",background:"#e8f2fa",marginBottom:14,outline:"none",boxSizing:"border-box"};
  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,background:"#deeaf5"}}>
      <div style={{width:"100%",maxWidth:360}}>

          <Logo size={36}/>
          <div>
            <div style={{fontWeight:800,fontSize:24,letterSpacing:-1,color:"#0a0a1a"}}>MnK</div>
            <div style={{fontSize:10,color:"#446688",letterSpacing:2,fontWeight:700,textTransform:"uppercase"}}>HOME + FOOD</div>
          </div>
        </div>
        <div style={{display:"flex",marginBottom:20,border:"1px solid #a8c4e0",borderRadius:10,overflow:"hidden"}}>
          {["login","signup"].map(m=><button key={m} onClick={()=>{setMode(m);setErr("");}} style={{flex:1,padding:"10px",background:mode===m?"#ccdff0":"transparent",border:"none",cursor:"pointer",fontSize:13,fontWeight:mode===m?700:400,color:mode===m?"#0a0a1a":"#446688",fontFamily:"inherit"}}>{m==="login"?"Sign In":"Create Account"}</button>)}
        </div>
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="Email" style={inp} autoCapitalize="none" onFocus={FL} onBlur={FB}/>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="Password" style={{...inp,marginBottom:20}} onFocus={FL} onBlur={FB}/>
        {err&&<div style={{fontSize:12,color:err.includes("Check")?"#2a7a00":"#FF453A",marginBottom:14,padding:"9px 12px",borderRadius:8,background:err.includes("Check")?"#d8f5e0":"#ffe0e0"}}>{err}</div>}

/* ── Inventory View ── */
function InventoryView({tasks,onEdit}){
  const{text,border,cardBg,muted,lm}=useTheme();
  const[search,setSearch]=useState("");
  const[groupBy,setGroupBy]=useState("storage"); // "storage" | "category"

  const foodItems=tasks.filter(t=>!t.done&&t.masterType==="FOOD");
  const q=search.trim().toLowerCase();
  const filtered=foodItems.filter(t=>!q||t.title.toLowerCase().includes(q)||t.notes.toLowerCase().includes(q));

  const byStorage=(loc)=>filtered.filter(t=>getStorage(t.title)===loc).sort((a,b)=>{
    const da=a.dueDate?daysDiff(a.dueDate):999;
    const db_=b.dueDate?daysDiff(b.dueDate):999;
    return da-db_;
  });

  const fridge=byStorage("fridge");
  const freezer=byStorage("freezer");
  const pantry=byStorage("pantry");

  const expiryBadge=(t)=>{
    if(!t.dueDate)return null;
    const diff=daysDiff(t.dueDate);
    if(diff<0)return{text:`${Math.abs(diff)}d ago`,bg:"#FF453A",color:"#fff"};
    if(diff===0)return{text:"today",bg:"#FF453A",color:"#fff"};
    if(diff===1)return{text:"tmrw",bg:"#FF9F0A",color:"#000"};
    if(diff<=7)return{text:`${diff}d`,bg:"#FF9F0A22",color:"#FF9F0A"};
    if(diff<=12)return{text:`${diff}d`,bg:"#FFD60A22",color:"#B8960A"};
    return{text:`${diff}d`,bg:lm?"#e8f2fa":"#1a1a1a",color:muted};
  };

  const InvRow=({t})=>{
    const emoji=getFoodEmoji(t.title);
    const badge=expiryBadge(t);
    const isUrgent=t.dueDate&&daysDiff(t.dueDate)<=1;
    const isExpired=t.dueDate&&daysDiff(t.dueDate)<0;
    return(
      <div onClick={()=>onEdit(t)} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 12px",borderRadius:9,background:isExpired?(lm?"#ffe8e8":"#1a0808"):(isUrgent?(lm?"#fff5e0":"#1a0e00"):cardBg),marginBottom:4,border:`1px solid ${isExpired?"#FF453A33":(isUrgent?"#FF9F0A33":border)}`,cursor:"pointer",transition:"border-color .1s"}}
        onMouseEnter={e=>e.currentTarget.style.borderColor="#888"}
        onMouseLeave={e=>e.currentTarget.style.borderColor=isExpired?"#FF453A33":(isUrgent?"#FF9F0A33":border)}>
        <span style={{fontSize:18,width:24,textAlign:"center",flexShrink:0}}>{emoji||"🥫"}</span>
        <span style={{flex:1,fontSize:13,fontWeight:500,color:text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</span>
        {badge&&(
          <span style={{fontSize:11,fontWeight:700,padding:"2px 7px",borderRadius:6,background:badge.bg,color:badge.color,flexShrink:0,whiteSpace:"nowrap"}}>{badge.text}</span>
        )}
      </div>
    );
  };

  const StorageSection=({icon,label,color,items})=>{
    if(!items.length)return null;
    return(
      <div style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,padding:"8px 12px",borderRadius:10,background:lm?"#e8f2fa":"#111"}}>
          <span style={{fontSize:20}}>{icon}</span>
          <span style={{fontSize:12,fontWeight:800,color,letterSpacing:.8,textTransform:"uppercase"}}>{label}</span>
          <span style={{fontSize:11,color:muted,marginLeft:2}}>{items.length} item{items.length!==1?"s":""}</span>
        </div>
        {items.map(t=><InvRow key={t.id} t={t}/>)}
      </div>
    );
  };

  const total=filtered.length;

  return(
    <div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0}}>
      {/* Search */}
      <div style={{padding:"8px 14px",borderBottom:`1px solid ${border}`,background:lm?"#d6e8f5":"#0a0a0a",flexShrink:0}}>
        <div style={{position:"relative",maxWidth:600,margin:"0 auto"}}>
          <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:13,color:muted,pointerEvents:"none"}}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="Search inventory…"
            style={{width:"100%",padding:"7px 30px 7px 32px",borderRadius:9,border:`1px solid ${border}`,background:lm?"#e8f2fa":"#1a1a1a",color:text,fontSize:14,fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}
            onFocus={FL} onBlur={FB}/>
          {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:14,color:muted,lineHeight:1,padding:2}}>✕</button>}
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,overflowY:"auto",padding:"14px 14px 100px"}}>
        <div style={{maxWidth:600,margin:"0 auto"}}>
          {total===0?(
            <div style={{textAlign:"center",padding:"60px 0",color:muted}}>
              <div style={{fontSize:44,marginBottom:14}}>{q?"🔍":"📦"}</div>
              <div style={{fontWeight:700,fontSize:15,color:lm?"#446688":"#aaa",marginBottom:6}}>
                {q?`No results for "${search}"`:"Inventory is empty"}
              </div>
              {!q&&<div style={{fontSize:12,opacity:.7}}>Add food items in the FOOD tab</div>}
            </div>
          ):(
            <>
              <StorageSection icon="🧊" label="Fridge" color={lm?"#2a7a9a":"#4EA8DE"} items={fridge}/>
              <StorageSection icon="❄️" label="Freezer" color={lm?"#446688":"#7AB8E0"} items={freezer}/>
              <StorageSection icon="🏠" label="Pantry" color={lm?"#6a5a2a":"#C8A83A"} items={pantry}/>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Tab Bar ── */
function TabBar({activeTab,onTabChange,tasks,lm,border,muted}){
  const TABS=[
    {id:"FOOD",icon:"🍽",label:"FOOD",accent:"#FF9F0A",accentBg:lm?"#fff8ec":"#1a1200"},
    {id:"HOUSE",icon:"🏠",label:"HOUSE",accent:"#4EA8DE",accentBg:lm?"#e8f4ff":"#0a1a2a"},
    {id:"INVENTORY",icon:"📦",label:"STOCK",accent:"#30D158",accentBg:lm?"#e0f5e9":"#0a1a0a"},
  ];
  return(
    <div style={{display:"flex",background:lm?"#ccdff0":"#000",borderTop:`1px solid ${border}`,paddingBottom:"env(safe-area-inset-bottom,0px)",flexShrink:0}}>
      {TABS.map(t=>{
        const isActive=activeTab===t.id;
        const cnt=t.id==="INVENTORY"?tasks.filter(x=>!x.done&&x.masterType==="FOOD").length:tasks.filter(x=>!x.done&&x.masterType===t.id).length;
        return(
          <button key={t.id} onClick={()=>onTabChange(t.id)}
            style={{flex:1,padding:"13px 8px 11px",border:"none",background:isActive?t.accentBg:"transparent",cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:3,transition:"background .15s",borderTop:isActive?`2px solid ${t.accent}`:"2px solid transparent"}}>
            <span style={{fontSize:20,lineHeight:1}}>{t.icon}</span>
            <span style={{fontSize:10,fontWeight:isActive?800:500,color:isActive?t.accent:muted,letterSpacing:.5}}>{t.label}</span>
            {cnt>0&&<span style={{fontSize:10,color:isActive?t.accent:muted,opacity:.8}}>{cnt}</span>}
          </button>
        );
      })}
    </div>
  );
}

/* ── Main View (FOOD + HOUSE) ── */
function MainView({tasks,onEdit,onCheck,activeTab,readOnly}){
  const{text,border,cardBg,muted,lm}=useTheme();
  const[search,setSearch]=useState("");

  const FOOD_ACCENT="#FF9F0A";
  const HOUSE_ACCENT="#4EA8DE";
  const isFood=activeTab==="FOOD";
  const accent=isFood?FOOD_ACCENT:HOUSE_ACCENT;
  const accentBg=isFood?(lm?"#fff8ec":"#1a1200"):(lm?"#e8f4ff":"#0a1a2a");

  const q=search.trim().toLowerCase();
  const tabItems=[...tasks.filter(t=>!t.done&&t.masterType===activeTab&&(!q||t.title.toLowerCase().includes(q)||t.notes.toLowerCase().includes(q)))]
    .sort((a,b)=>{
      const da=a.dueDate?daysDiff(a.dueDate):999;
      const db_=b.dueDate?daysDiff(b.dueDate):999;
      return da-db_;
    });

  const noDate=tabItems.filter(t=>!t.dueDate);
  const withDate=tabItems.filter(t=>t.dueDate);
  const overdue=withDate.filter(t=>daysDiff(t.dueDate)<0);
  const today=withDate.filter(t=>daysDiff(t.dueDate)===0);
  const soon=withDate.filter(t=>daysDiff(t.dueDate)>=1&&daysDiff(t.dueDate)<=3);
  const later=withDate.filter(t=>daysDiff(t.dueDate)>3);
  // FOOD-specific buckets (0–7 = this week, 8–12 = expiring soon, >12 = good)
  const foodThisWeek=withDate.filter(t=>{const d=daysDiff(t.dueDate);return d>=0&&d<=7;});
  const foodSoon=withDate.filter(t=>{const d=daysDiff(t.dueDate);return d>=8&&d<=12;});
  const foodGood=withDate.filter(t=>daysDiff(t.dueDate)>12);

  const dateLabel=(dueDate)=>{
    const diff=daysDiff(dueDate);
    if(diff===null)return{text:"no date",color:muted,weight:400};
    if(isFood){
      if(diff<0)return{text:`Expired ${Math.abs(diff)}d ago`,color:"#FF453A",weight:800};
      if(diff===0)return{text:"Expires today",color:"#FF453A",weight:800};
      if(diff===1)return{text:"Expires tomorrow",color:"#FF9F0A",weight:700};
      if(diff<=7)return{text:`Expires in ${diff}d`,color:"#FF9F0A",weight:600};
      if(diff<=12)return{text:`Expires in ${diff}d`,color:lm?"#9a7a00":"#FFD60A",weight:500};
      return{text:`Expires in ${diff}d`,color:lm?"#446688":"#888",weight:400};
    } else {
      if(diff<0)return{text:`${Math.abs(diff)}d overdue`,color:"#FF453A",weight:800};
      if(diff===0)return{text:"Due today",color:"#30D158",weight:800};
      if(diff===1)return{text:"Due tomorrow",color:"#FF9F0A",weight:700};
      return{text:`Due in ${diff}d`,color:lm?"#446688":"#888",weight:400};
    }
  };

  const Row=({t})=>{
    const dl=t.dueDate?dateLabel(t.dueDate):{text:"no date",color:muted,weight:400};
    const isOverdue=t.dueDate&&daysDiff(t.dueDate)<0;
    const isUrgent=t.dueDate&&daysDiff(t.dueDate)<=1;
    const rowBg=isOverdue?(lm?"#ffe8e8":"#1a0808"):(isUrgent&&isFood?(lm?"#fff5e0":"#1a0e00"):cardBg);
    const rowBorder=isOverdue?"#FF453A44":(isUrgent&&isFood?"#FF9F0A44":border);
    const emoji=isFood?getFoodEmoji(t.title):null;
    return(
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"13px 14px",borderRadius:11,background:rowBg,marginBottom:5,border:`1px solid ${rowBorder}`,transition:"border-color .1s"}}
        onMouseEnter={e=>e.currentTarget.style.borderColor=isOverdue?"#FF453A88":"#888"}
        onMouseLeave={e=>e.currentTarget.style.borderColor=rowBorder}>
        {emoji&&<span style={{fontSize:18,flexShrink:0,width:22,textAlign:"center"}}>{emoji}</span>}
        <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>onEdit(t)}>
          <div style={{fontSize:14,fontWeight:600,color:text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title||<span style={{color:muted,fontStyle:"italic"}}>Untitled</span>}</div>
          {t.notes&&<div style={{fontSize:11,color:muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginTop:2}}>{t.notes}</div>}
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          <div style={{fontSize:12,fontWeight:dl.weight,color:dl.color,whiteSpace:"nowrap"}}>{dl.text}</div>
        </div>
        {!readOnly&&(
          <button onClick={()=>onCheck(t.id)}
            style={{width:34,height:34,borderRadius:8,border:`1px solid ${accent}44`,background:lm?accentBg:"transparent",color:accent,fontWeight:800,fontSize:14,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s"}}
            title={isFood?"Mark as used":"Mark done"}>
            ✓
          </button>
        )}
      </div>
    );
  };

  const Sec=({label,color,items,sublabel})=>{
    if(!items.length)return null;
    return(
      <div style={{marginBottom:18}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <div style={{width:3,height:14,borderRadius:2,background:color,flexShrink:0}}/>
          <span style={{fontSize:10,fontWeight:700,color,letterSpacing:1.2,textTransform:"uppercase"}}>{label}</span>
          {sublabel&&<span style={{fontSize:10,color:muted,opacity:.7}}>{sublabel}</span>}
          <span style={{fontSize:10,color:muted}}>{items.length}</span>
        </div>
        {items.map(t=><Row key={t.id} t={t}/>)}
      </div>
    );
  };

  return(
    <div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0}}>
      {/* Search bar */}
      <div style={{padding:"8px 14px",borderBottom:`1px solid ${border}`,background:lm?"#d6e8f5":"#0a0a0a",flexShrink:0}}>
        <div style={{position:"relative",maxWidth:600,margin:"0 auto"}}>
          <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:13,color:muted,pointerEvents:"none"}}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)}
            placeholder={isFood?"Search food items…":"Search tasks…"}
            style={{width:"100%",padding:"7px 30px 7px 32px",borderRadius:9,border:`1px solid ${border}`,background:lm?"#e8f2fa":"#1a1a1a",color:text,fontSize:14,fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}
            onFocus={FL} onBlur={FB}/>
          {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:14,color:muted,lineHeight:1,padding:2}}>✕</button>}
        </div>
      </div>

      {/* Scrollable content */}
      <div style={{flex:1,overflowY:"auto",padding:"14px 16px 16px"}}>
        <div style={{maxWidth:600,margin:"0 auto"}}>
          {tabItems.length===0&&(
            <div style={{textAlign:"center",padding:"64px 0",color:muted}}>
              <div style={{fontSize:44,marginBottom:14}}>{q?"🔍":(isFood?"🍽":"🏠")}</div>
              <div style={{fontWeight:700,fontSize:15,color:lm?"#446688":"#aaa",marginBottom:6}}>
                {q?`No results for "${search}"`:(isFood?"No food items yet":"No tasks yet")}
              </div>
              {!q&&<div style={{fontSize:12,opacity:.7}}>Tap <strong>+</strong> to add {isFood?"something expiring soon":"a task"}</div>}
            </div>
          )}
          {isFood?(
            <>
              <Sec label="Expired" color="#FF453A" items={overdue}/>
              <Sec label="Expiring This Week" color="#FF9F0A" sublabel="≤7 days" items={foodThisWeek}/>
              <Sec label="Expiring Soon" color={lm?"#9a7a00":"#FFD60A"} sublabel="8–12 days" items={foodSoon}/>
              <Sec label="Still Good" color="#30D158" items={foodGood}/>
              {noDate.length>0&&<Sec label="No Date" color={muted} items={noDate}/>}
            </>
          ):(
            <>
              <Sec label="Overdue" color="#FF453A" items={overdue}/>
              <Sec label="Today" color="#30D158" items={today}/>
              <Sec label="Tomorrow & Soon" color="#FF9F0A" items={soon}/>
              <Sec label="Upcoming" color={lm?"#446688":"#888"} items={later}/>
              {noDate.length>0&&<Sec label="No Date" color={muted} items={noDate}/>}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── MainApp ── */
function MainApp({user,board,onSignOut}){
  const[tasks,setTasks]=useState([]);
  const[loading,setLoading]=useState(true);
  const[syncing,setSyncing]=useState(false);
  const[editing,setEditing]=useState(null);
  const[showQuickAdd,setShowQuickAdd]=useState(false);
  const[showSidebar,setShowSidebar]=useState(false);
  const[showDisplay,setShowDisplay]=useState(false);
  const[showCheatSheet,setShowCheatSheet]=useState(false);
  const[activeTab,setActiveTab]=useState("FOOD");
  const[celebratingIds,setCelebratingIds]=useState(new Set());
  const[quickTitle,setQuickTitle]=useState("");
  const celebRef=useRef(new Set());
  const subRef=useRef(null);
  const quickRef=useRef(null);
  const[settings,setSettings]=useState({lightMode:true});
  const dispKey=`mnk_disp_${user.id}_${board.id}`;

  useEffect(()=>{
    try{const s=JSON.parse(localStorage.getItem(dispKey)||"{}");if(Object.keys(s).length)setSettings(s);}catch{}
    db.from("board_settings").select("*").eq("board_id",board.id).single().then(({data})=>{
      if(data?.display_json){try{const s=JSON.parse(data.display_json);setSettings(s);}catch{}}
    });
  },[board.id]);

  const saveSettings=async s=>{
    setSettings(s);
    try{localStorage.setItem(dispKey,JSON.stringify(s));}catch{}
    document.documentElement.classList.toggle("light",!!s.lightMode);
    await db.from("board_settings").upsert({board_id:board.id,display_json:JSON.stringify(s)},{onConflict:"board_id"});
  };

  useEffect(()=>{
    document.documentElement.classList.toggle("light",!!settings.lightMode);
  },[settings.lightMode]);

  const loadTasks=async()=>{
    const{data}=await db.from("tasks").select("*").eq("board_id",board.id).eq("done",false);
    if(data)setTasks(data.map(dbToTask));
    setLoading(false);
  };

  useEffect(()=>{
    loadTasks();
    subRef.current=db.channel(`tasks_${board.id}`)
      .on("postgres_changes",{event:"*",schema:"public",table:"tasks",filter:`board_id=eq.${board.id}`},()=>{
        loadTasks();
      }).subscribe();
    return()=>{if(subRef.current)db.removeChannel(subRef.current);};
  },[board.id]);

  const saveTask=async t=>{
    setSyncing(true);
    const{error}=await db.from("tasks").upsert(t2db(t,board.id));
    setSyncing(false);
    if(!error){setTasks(ts=>{const i=ts.findIndex(x=>x.id===t.id);if(i>=0){const c=[...ts];c[i]=t;return c;}return[...ts,t];});setEditing(null);}
    else alert("Save failed – check connection.");
  };

  const addTask=async t=>{
    setSyncing(true);
    const{error}=await db.from("tasks").upsert(t2db(t,board.id));
    setSyncing(false);
    if(!error)setTasks(ts=>[...ts,t]);
    else alert("Failed to save – check connection.");
  };

  const delTask=async id=>{
    setSyncing(true);
    await db.from("tasks").delete().eq("id",id);
    setSyncing(false);
    setTasks(ts=>ts.filter(t=>t.id!==id));
    setEditing(null);
  };

  const checkTask=async id=>{
    const ct=tasks.find(t=>t.id===id);
    if(!ct)return;
    const hasFreq=ct.frequency&&ct.frequency.trim();
    const e={id:genId(),doneAt:new Date().toISOString()};
    celebRef.current.add(id);
    setCelebratingIds(s=>{const n=new Set(s);n.add(id);return n;});
    const endCel=()=>{setCelebratingIds(s=>{const n=new Set(s);n.delete(id);return n;});setTimeout(()=>celebRef.current.delete(id),60);};
    if(!hasFreq){
      const u={...ct,done:true,completionLog:[...(ct.completionLog||[]),e]};
      setTasks(ts=>ts.map(t=>t.id===id?u:t));
      setTimeout(async()=>{
        setSyncing(true);
        await db.from("tasks").upsert(t2db(u,board.id));
        setSyncing(false);
        setTasks(ts=>ts.filter(t=>t.id!==id));
        endCel();
      },1500);
    } else {
      setTimeout(async()=>{
        const nd=nextDue(ct.frequency)||ct.dueDate;
        const u={...ct,dueDate:nd,completionLog:[...(ct.completionLog||[]),e]};
        setSyncing(true);
        await db.from("tasks").upsert(t2db(u,board.id));
        setSyncing(false);
        setTasks(ts=>ts.map(t=>t.id===id?u:t));
        endCel();
      },1500);
    }
  };

  /* ── Retroactive date fix ── */
  const handleRetroDate=async()=>{
    let count=0;
    const updates=[];
    for(const t of tasks){
      const md=extractMonthDate(t.title);
      if(md&&md!==t.dueDate){
        updates.push({...t,dueDate:md});
        count++;
      }
    }
    if(updates.length>0){
      setSyncing(true);
      for(const u of updates){
        await db.from("tasks").upsert(t2db(u,board.id));
      }
      setSyncing(false);
      setTasks(ts=>ts.map(t=>{const u=updates.find(x=>x.id===t.id);return u||t;}));
    }
    return count;
  };

  /* ── Inline quick-add ── */
  const handleQuickAdd=()=>{
    if(!quickTitle.trim())return;
    const type=activeTab==="INVENTORY"?"FOOD":activeTab||"FOOD";
    const t=mkTask(board.id,type);
    t.title=quickTitle.trim();
    t.dueDate=extractMonthDate(quickTitle.trim())||todayStr();
    addTask(t);
    setQuickTitle("");
    quickRef.current&&quickRef.current.focus();
  };

  const lm=!!settings.lightMode;
  const theme={
    bg:lm?"#deeaf5":"#000",navBg:lm?"#ccdff0":"#000",
    cardBg:lm?"#ffffff":"#1c1c1e",border:lm?"#a8c4e0":"#2a2a2a",
    text:lm?"#0a0a1a":"#e8e8e8",muted:lm?"#446688":"#555",
    inp:lm?"#e8f2fa":"#1a1a1a",lm
  };

  if(loading)return(
    <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",background:lm?"#deeaf5":"#000",flexDirection:"column",gap:12}}>
      <Logo size={36}/>
      <div className="spin" style={{width:20,height:20,border:`2px solid ${lm?"#a8c4e0":"#333"}`,borderTopColor:lm?"#2a7a00":LIME,borderRadius:"50%"}}/>
    </div>
  );

  return(
    <ThemeCtx.Provider value={theme}>
    <div style={{height:"100%",display:"flex",flexDirection:"column",background:theme.bg,color:theme.text}}>

      {/* Nav bar */}
      <div style={{background:theme.navBg,borderBottom:`1px solid ${theme.border}`,padding:"0 12px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",height:50,gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
            <button onClick={()=>setShowSidebar(true)} style={{background:"none",border:"none",cursor:"pointer",color:theme.muted,fontSize:18,padding:"0 2px",lineHeight:1}}>☰</button>
            <Logo size={20}/>
            <span style={{fontWeight:800,fontSize:15,letterSpacing:-.5,color:theme.text}}>MnK</span>
            {syncing&&<span style={{fontSize:8,color:"#30D158",letterSpacing:1,textTransform:"uppercase"}}>SYNCING</span>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,flex:1,justifyContent:"flex-end",minWidth:0}}>
            <input
              ref={quickRef}
              value={quickTitle}
              onChange={e=>setQuickTitle(e.target.value)}
              onKeyDown={e=>{
                if(e.key==="Enter"){if(quickTitle.trim())handleQuickAdd();else setShowQuickAdd(true);}
                if(e.key==="Escape"){setQuickTitle("");e.target.blur();}
              }}
              placeholder={activeTab==="HOUSE"?"Add task…":"Add food…"}
              style={{flex:1,maxWidth:180,minWidth:0,padding:"7px 10px",borderRadius:8,border:`1px solid ${theme.border}`,background:theme.inp,color:theme.text,fontSize:14,fontFamily:"inherit",outline:"none"}}
              onFocus={e=>e.target.style.borderColor="#888"}
              onBlur={e=>e.target.style.borderColor=""}
            />
            <button
              onClick={()=>{if(quickTitle.trim())handleQuickAdd();else setShowQuickAdd(true);}}
              style={{width:36,height:36,borderRadius:10,border:"none",background:LIME,color:"#000",fontSize:24,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              +
            </button>
          </div>
        </div>
      </div>

      {/* Main content */}
      {activeTab==="INVENTORY"?(
        <InventoryView tasks={tasks} onEdit={setEditing}/>
      ):(
        <MainView
          tasks={tasks}
          onEdit={setEditing}
          onCheck={checkTask}
          activeTab={activeTab}
          readOnly={false}
        />
      )}

      {/* Shared tab bar */}
      <TabBar
        activeTab={activeTab}
        onTabChange={(tab)=>setActiveTab(tab)}
        tasks={tasks}
        lm={lm}
        border={theme.border}
        muted={theme.muted}
      />

      {/* Modals */}
      {showSidebar&&<Sidebar onClose={()=>setShowSidebar(false)} onDisplay={()=>setShowDisplay(true)} onSignOut={onSignOut} onCheatSheet={()=>setShowCheatSheet(true)} onRetroDate={handleRetroDate}/>}
      {showDisplay&&<DisplayMdl settings={settings} onChange={saveSettings} onClose={()=>setShowDisplay(false)}/>}
      {showCheatSheet&&<CheatSheetMdl onClose={()=>setShowCheatSheet(false)}/>}
      {showQuickAdd&&<QuickAddModal boardId={board.id} onAdd={t=>{addTask(t);setShowQuickAdd(false);}} onClose={()=>setShowQuickAdd(false)} defaultType={activeTab}/>}
      {editing&&<EditMdl task={editing} onSave={saveTask} onClose={()=>setEditing(null)} onDelete={()=>delTask(editing.id)}/>}
    </div>
    </ThemeCtx.Provider>
  );
}

/* ── Root ── */
function Root(){
  const[screen,setScreen]=useState("loading");
  const[user,setUser]=useState(null);
  const[board,setBoard]=useState(null);

  const openMain=async u=>{
    const{data:members}=await db.from("board_members")
      .select("role,boards(*)")
      .eq("user_id",u.id)
      .order("created_at",{referencedTable:"boards",ascending:true});
    const boards=(members||[]).map(m=>({...m.boards,role:m.role})).filter(b=>b.id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    if(boards.length>0){
      setBoard(boards[0]);setScreen("app");
    } else {
      const{data:nb,error}=await db.from("boards").insert({user_id:u.id,name:"MAIN",emoji:"🏠"}).select().single();
      if(!error&&nb){
        await db.from("board_members").upsert({board_id:nb.id,user_id:u.id,role:"owner"},{onConflict:"board_id,user_id"});
        setBoard(nb);setScreen("app");
      } else {
        console.error("Failed to create MAIN board",error);
        setScreen("auth");
      }
    }
  };

  useEffect(()=>{
    document.documentElement.classList.add("light");
    db.auth.getSession().then(({data:{session}})=>{
      if(session){setUser(session.user);openMain(session.user);}
      else setScreen("auth");
    });
    const{data:{subscription}}=db.auth.onAuthStateChange((_,session)=>{
      if(session){setUser(session.user);setScreen(s=>s==="loading"?"loading":s);}
      else{setUser(null);setBoard(null);setScreen("auth");}
    });
    return()=>subscription.unsubscribe();
  },[]);

  if(screen==="loading")return(
    <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",background:"#deeaf5",flexDirection:"column",gap:12}}>
      <Logo size={40}/>
      <div className="spin" style={{width:20,height:20,border:"2px solid #a8c4e0",borderTopColor:"#2a7a00",borderRadius:"50%"}}/>
    </div>
  );
  if(screen==="auth")return<AuthScreen onAuth={u=>{setUser(u);openMain(u);}}/>;
  if(screen==="app"&&board)return<MainApp user={user} board={board} onSignOut={()=>db.auth.signOut()}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
